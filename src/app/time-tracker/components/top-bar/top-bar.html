<div class="bar">
  <div class="title-group" [style.padding-left]="headOffset()">
    <span class="week-label">{{ weekLabel() }}</span>
    <span class="week-range">{{ weekRange() }}</span>
  </div>
  <div class="actions">
    @for (t of timers(); track t.id) {
      <div class="timer-pill">
        <span class="timer-dot"></span>
        <span class="timer-title">{{ t.title }}</span>
        <span class="timer-elapsed">{{ t.elapsed }}</span>
        <button (click)="t.stop()" class="tt-stop-btn">Stop</button>
        <button (click)="t.discard()" title="Discard timer" class="tt-discard-btn">✕</button>
      </div>
    }
    <button (click)="openTimer()()" class="tt-start-timer-btn">
      <span class="play-icon">▶</span>
      <span>Start timer</span>
    </button>
    <div class="week-nav">
      <button (click)="prevWeek()()" class="tt-week-nav-btn">‹</button>
      <span class="week-nav-label">Week</span>
      <button (click)="nextWeek()()" class="tt-week-nav-btn">›</button>
    </div>
    <button (click)="goToday()()" class="tt-today-btn">Today</button>
    <button (click)="openSettings()()" title="Settings" class="tt-settings-btn">Settings</button>
  </div>
</div>
